{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<article class="narrow">
  <hgroup>
    <h1>Log in</h1>
    <p>Continue your training.</p>
  </hgroup>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="meta">New here? <a href="{% url 'accounts:signup' %}">Create an account</a>.</p>
</article>
{% endblock %}
